parse_cv_task:
  description: >
    Parse the CV located at {cv}.

    First, use the convert_cv_to_markdown tool to extract the content of the PDF.

    Keep the complete Markdown returned by the extraction tool in the
    "cv" field of the structured CV. This is the original CV
    evidence and must remain available to downstream agents, especially the
    CV optimizer.

    Then, extract and structure all relevant information explicitly stated
    in the CV.

    Preserve the original meaning and relevant source evidence.

    Do not invent or infer information that is not explicitly supported by
    the CV.

    Distinguish between information that is explicitly stated and information
    that is not present.

    Preserve the source section and relevant source text whenever possible.

    Keep information that does not clearly belong to a predefined category
    under "other" rather than discarding it.

    Do not evaluate the CV, compare it to a job posting, assign scores, or
    provide recommendations.

  expected_output: >
    A structured CV containing education, work experience, skills, projects,
    certifications, languages, achievements, summary information, and other
    relevant content, with source evidence whenever available.

  
parse_job_task:
  description: >
    Parse the job posting provided by the user below. The job content has
    already been extracted from its URL or provided as text. Use only this
    content as the source of truth:

    {job}

    Then, extract and structure all relevant information explicitly stated
    in the job posting.

    Preserve the original meaning and relevant source evidence.

    Do not invent or infer requirements, skills, experience, qualifications,
    responsibilities, seniority, or other information that is not explicitly
    supported by the job posting.

    Distinguish between required and preferred requirements whenever this
    distinction is explicitly stated.

    Preserve the source section and relevant source text whenever possible.

    Keep information that does not clearly belong to a predefined category
    under "other_requirements" rather than discarding it.

    Do not evaluate the candidate, compare the job posting to a CV, assign
    scores, or provide recommendations.

  expected_output: >
    A structured job posting containing the job title, company, location,
    employment type, seniority, required and preferred skills, experience
    requirements, education requirements, responsibilities, keywords, and
    other relevant requirements, with source evidence whenever available.


review_cv_task:
  description: >
    Review the structured CV against the structured job posting.

    The context contains:
    1. The output of the CV Parser Agent.
    2. The output of the Job Parser Agent.

    The CV parser output includes the original extracted CV Markdown in
    "cv". Use it to verify source evidence when needed, but do
    not treat information absent from the structured CV or source Markdown as
    candidate evidence.

    First, use the get_evaluation_framework tool to retrieve the evaluation
    framework.

    Use the framework as the evaluation methodology for this review.

    Use the provided CV and job data as the only source of candidate and job
    information.

    Do not access external information about the candidate.

    Distinguish between:
    - satisfied evidence
    - weak evidence
    - no evidence
    - uncertain evidence

    Do not interpret absence of evidence as proof that the candidate lacks
    a requirement.

    Distinguish between skills that are merely listed and skills demonstrated
    through experience, projects, coursework, responsibilities, or
    achievements.

    Evaluate requirements according to their importance in the specific job.

    Identify:
    - strong matches
    - weak evidence
    - missing evidence
    - relevant strengths
    - relevant weaknesses

    Do not provide recommendations or suggest CV improvements.

    Do not assign numerical scores.

    Do not make a hiring decision or state that the candidate is or is not
    viable for the role.

  expected_output: >
    A validated ReviewerResult containing requirement matches, evidence
    strength, missing evidence, relevant strengths, relevant weaknesses,
    overall assessment, and supporting reasoning.


optimize_cv_task:
  description: >
    Optimize the structured CV for the specific job posting.

    The context contains:
    1. The structured CV, including the original extracted CV Markdown in
       "cv".
    2. The structured job posting.
    3. The Reviewer's assessment.

    Use the original CV Markdown and StructuredCV as the source of truth.
    Use the Reviewer's diagnosis to prioritize investigation, but verify every
    conclusion against the original CV and never follow it blindly.

    Follow these phases in order.

    PHASE 1 - AUTONOMOUS OPTIMIZATION

    Before asking any question, use the Reviewer's diagnosis to find every
    useful improvement supported by existing CV evidence. Optimize
    assertively for the target role: improve wording, ordering, clarity,
    relevance, organization, and information hierarchy without changing
    factual meaning.

    Treat the Reviewer's diagnosis as the primary optimization objective, not
    as optional advice. You have full editorial freedom to change the CV's
    structure and presentation: rewrite, condense, expand from supported
    evidence, reorder, rename, group, split, merge, create, relocate, or
    remove content whenever this improves alignment with the review. You may
    substantially change the information architecture and wording; the only
    hard boundary is that factual claims must remain supported by the original
    CV or explicit user answers.

    Keep the audit trail granular and independently approvable. Record each
    concrete operation, including moving content, renaming a category, splitting
    or merging sections, creating a Projects section, removing duplication,
    reordering education, adding a confirmed date, adding a skill, or adding
    a project.

    Do not force a universal CV structure or use a fixed template. Place each
    fact in the most semantically appropriate section for this particular CV,
    field, and target role.

    Keep any Summary or profile section concise and appropriate to the source
    CV. Do not turn it into a technical inventory.

    Use the Reviewer's requirements as an optimization checklist. Make the
    strongest supported evidence for the most important requirements visible
    in the first scan of the CV. Align terminology with the job only when the
    candidate's underlying evidence supports it.

    PHASE 2 - EXHAUSTIVE TARGETED USER QUESTIONS

    Treat every requirement_match whose status is no_evidence, weak_evidence,
    or uncertain as an open gap. "No evidence in CV" means unknown, never
    that the candidate lacks the requirement.

    Before calling ask_user, build an internal checklist containing every open
    requirement_match plus every item in missing_evidence and weak_evidence.
    Deduplicate equivalent items, but preserve all distinct requirements.

    Process the complete checklist before finishing. For each open gap, ask one
    focused question that allows the candidate to confirm experience, provide
    evidence, say it does not apply, or say they do not have it.

    If a question covers multiple gaps, record and evaluate the answer
    separately for each gap. If an answer is ambiguous, ask one focused
    clarification before using it. If a positive answer lacks enough detail
    for a useful CV statement, ask one focused follow-up for that same gap.

    Do not repeat information already present in the CV, previous questions, or
    answers.

    Do not stop after a useful answer or after a fixed number of questions.
    Stop only when every checklist item has a corresponding question and
    answer, including explicit negative answers, or is already supported by
    existing evidence.

    Before producing the draft, check consistency over dates, institutions,
    degrees, roles, projects, and technologies. Never move a confirmed fact
    from one entity to another. If its scope is unclear, ask for clarification.

    The final unresolved_evidence_gaps must contain every item that remains
    unsupported or ambiguous. It must not be shortened simply because the
    questioning phase ended.

    Keep original CV evidence in source_evidence and user answers in
    user_provided_evidence. Record every question and answer in the audit
    trail.

    For every proposed change set evidence_source to cv, user, or cv_and_user
    and set requires_human_approval to true.

    The optimized Markdown is a proposed draft for later human approval.
    Apply supported changes to the draft, but do not claim that they have been
    approved or modify the original CV file.

    Before saving, verify that every user answer is classified as supported,
    unsupported, not applicable, or ambiguous. Every supported answer that is
    relevant to the CV should be represented in the optimized draft and
    included in proposed_changes.

    Never add skills from the job posting, unconfirmed technologies, metrics,
    project outcomes, responsibilities, dates, or qualifications. Never
    invent, infer, or strengthen a claim beyond what the CV or the candidate
    explicitly provided.

    Job terminology may improve wording only when the underlying evidence
    already exists.

    Do not access GitHub, LinkedIn, portfolios, websites, or any other external
    candidate information. Do not make hiring decisions or viability claims.

    Do not use or access any CV template or generation framework. The optimizer
    is responsible only for deciding what content and structural changes should
    be made to the CV. The cv_generator task is responsible for applying that
    optimized content to the final template.

    Return the complete audit trail and every supported change needed by the
    cv_generator.

  expected_output: >
    A validated CVOptimizationResult containing granular proposed changes.
    Every change must include section, current_content, proposed_content,
    rationale, evidence_source, source_evidence, user_provided_evidence, and
    requires_human_approval. Include all questions and answers, the evidence
    supplied by the user, the optimization strategy, and unresolved evidence
    gaps that remain after questioning.


generate_cv_task:
  description: >
    Create the final CV by filling the Markdown template returned by
    get_generation_framework.

    The context contains:
    1. The complete StructuredCV from the CV Parser, including the original
      extracted CV text and source evidence.
    2. The CVOptimizationResult from the Optimizer, including proposed changes,
      evidence sources, user answers, and unresolved evidence gaps.

    First, call get_generation_framework. Its returned Markdown is the exact
    output template. The final CV MUST follow this template exactly, including
    its headings, section order, field structure, Markdown syntax, and
    formatting conventions. Do not create a different structure or introduce
    alternative formatting. Replace its placeholders and examples with
    supported candidate information only. The template is a formatting and
    structure definition, not a source of candidate facts.

    Work through the following stages:

    1. Read the complete StructuredCV and CVOptimizationResult before writing
      any output. Establish the original CV and explicitly supported user
      answers as the evidence boundary.

    2. Review every proposed change independently. Apply supported changes
      whose evidence_source is cv, user, or cv_and_user and whose source
      evidence supports the proposed content. Apply changes marked
      requires_human_approval as a draft for later approval; do not discard
      them for that reason.

    3. Reject unsupported, ambiguous, unresolved, inferred, or job-only
      changes. Never use unresolved_evidence_gaps as content. Absence of
      evidence must result in omission, not an invented replacement.

    4. Fill the template using the candidate's supported information.
      Preserve the template's exact section order. Within sections such as
      Experience and Education, use reverse chronological order unless the
      template explicitly specifies otherwise.

    5. Prioritise relevant demonstrated experience, achievements, projects,
      research, practical coursework, supported skills, and explicit
      qualifications. Keep the Summary concise and evidence-based. Remove
      repetition and low-relevance detail when necessary, without removing
      relevant supported information.

    6. Replace every template placeholder with supported content. Remove
      placeholder text, examples, HTML comments, and sections with no
      supported content. Do not copy template examples into the final CV.

    7. Apply ATS and readability rules while preserving the template's
      structure: use standard text, consistent dates, concise bullets, and
      avoid unsupported icons, tables, columns, graphics, or decorative
      content.

    8. Run a final evidence audit. Confirm that every output value is supported
      by the original CV or an explicitly supported user answer. Specifically
      check that no job requirement, reviewer conclusion, assumed proficiency,
      metric, date, responsibility, qualification, link, or seniority claim
      was added without evidence.

    Return only the final CV in Markdown. Do not create a PDF, explain your
    reasoning, or include framework instructions in the response.

  expected_output: >
    The completed Markdown template following the provided template exactly,
    with only supported candidate content. Return only the Markdown document,
    with no placeholders, examples, comments, or explanations.