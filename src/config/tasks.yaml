parse_cv_task:

  description: >
    Parse the CV located at {cv}.

    First, use the convert_cv_to_markdown tool to extract the content of the PDF.

    Keep the complete Markdown returned by the extraction tool in the
    "cv" field of the structured CV. This is the original CV
    evidence and must remain available to downstream agents, especially the
    CV optimizer.

    Then, extract and structure all relevant information explicitly stated
    in the CV.

    Preserve the original meaning and relevant source evidence.

    Do not invent or infer information that is not explicitly supported by
    the CV.

    Distinguish between information that is explicitly stated and information
    that is not present.

    Preserve the source section and relevant source text whenever possible.

    Keep information that does not clearly belong to a predefined category
    under "other" rather than discarding it.

    Do not evaluate the CV, compare it to a job posting, assign scores, or
    provide recommendations.

  expected_output: >
    A structured CV containing education, work experience, skills, projects,
    certifications, languages, achievements, summary information, and other
    relevant content, with source evidence whenever available.

  

parse_job_task:

  description: >
    Parse the job posting provided by the user below:

    {job}

    If {job} is a URL (starts with http:// or https://) or requires extraction,
    use the convert_job_to_markdown tool to extract the job content first. If it
    is already provided as text, use that content directly as the source of truth.

    Then, extract and structure all relevant information explicitly stated
    in the job posting.

    Preserve the original meaning and relevant source evidence.

    Do not invent or infer requirements, skills, experience, qualifications,
    responsibilities, seniority, or other information that is not explicitly
    supported by the job posting.

    Distinguish between required and preferred requirements whenever this
    distinction is explicitly stated.

    Preserve the source section and relevant source text whenever possible.

    Keep information that does not clearly belong to a predefined category
    under "other_requirements" rather than discarding it.

    Do not evaluate the candidate, compare the job posting to a CV, assign
    scores, or provide recommendations.

  expected_output: >
    A structured job posting containing the job title, company, location,
    employment type, seniority, required and preferred skills, experience
    requirements, education requirements, responsibilities, keywords, and
    other relevant requirements, with source evidence whenever available.



review_cv_task:

  description: >
    Review the structured CV against the structured job posting and perform
    two independent evaluations: job fit and CV completeness.

    The context contains:
    1. The output of the CV Parser Agent, including the original extracted CV
       text in StructuredCV.cv and source evidence.
    2. The output of the Job Parser Agent, containing the posting's explicit
       requirements and source evidence.

    First, use get_evaluation_framework to retrieve the evaluation framework
    and apply it as the methodology for job-fit assessment. Use the provided
    CV and job data as the only sources of candidate and job information. You
    may refer to original CV text to verify parsed evidence, but do not treat
    information absent from both StructuredCV and source text as evidence.

    PART A - JOB FIT

    Evaluate every relevant requirement explicitly stated in the job posting.
    Keep requirement_matches limited to job requirements; do not put missing
    CV fields there unless the posting itself states them as requirements.
    For each requirement, preserve its category, EvidenceStatus, supporting
    evidence, and reasoning. Distinguish satisfied, weak_evidence,
    no_evidence, and uncertain. Do not interpret absence of evidence as proof
    that the candidate lacks the requirement.

    Distinguish skills merely listed from skills demonstrated through
    experience, projects, coursework, responsibilities, or achievements.
    Evaluate criteria according to importance in this specific job; required
    criteria receive greater attention than preferred criteria. Identify
    strong matches, weak evidence, missing evidence, relevant strengths,
    relevant weaknesses, and an overall assessment. Do not assign numeric
    scores, recommend CV changes, or make a hiring/viability decision.

    PART B - CV COMPLETENESS

    Independently inspect the complete StructuredCV and original CV text for
    relevant CV information. Populate the separate completeness list using
    CompletenessItem fields section, field, status, evidence, relevance, and
    reasoning. Use only present, missing, or uncertain for completeness
    status. Consider name; headline/professional identity; email; phone;
    location; LinkedIn; GitHub/portfolio; professional-summary evidence;
    experience; education; technical skills; tools/software; methodologies;
    transferable skills; languages; certifications/additional training;
    projects, volunteering, and other role-relevant evidence; and GDPR consent
    when applicable.

    For profile completeness, distinguish platform/activity mentions from
    direct URLs. A statement that projects are published on GitHub may make
    "GitHub activity/project evidence" present while "GitHub profile URL" is
    missing if no exact URL appears. Assess LinkedIn URL, GitHub URL, and
    portfolio URL as separate fields. One kind of evidence never proves the
    presence of a different profile URL.

    Decide whether each optional item is relevant to this candidate and target
    role; do not treat optional information as universally mandatory. Explain
    why an item is relevant or missing. For example, GitHub may matter for a
    technical role, projects may help entry-level candidates demonstrate
    evidence, and languages/certifications depend on the role and profile. A
    missing or uncertain item means unknown, not that the candidate lacks it.
    Record evidence only when it appears in the CV.

    Keep completeness separate from requirement_matches. A missing LinkedIn,
    GitHub, certification, or language detail belongs only in completeness
    unless the posting separately names it as a requirement. Never infer
    missing candidate information. Never search external candidate sources,
    including GitHub, LinkedIn, portfolios, or websites. Do not access the
    final CV template. Do not suggest improvements, edit the CV, assign scores,
    make hiring decisions, or state candidate viability.

    Before returning ReviewerResult, check that each job requirement comes
    from the posting, every evidence statement is present in the supplied CV,
    and completeness items are stored only in completeness. Explain
    uncertainty rather than guessing.

  expected_output: >
    A validated ReviewerResult containing separate requirement_matches and
    completeness lists, plus missing_evidence, weak_evidence, strengths,
    weaknesses, overall_assessment, and supporting reasoning. Job-fit gaps
    must not be mixed with CV-completeness gaps. Return overall_assessment
    and top-level reasoning as single strings, not lists. Use lists only for
    fields defined as lists in ReviewerResult. Each item-level reasoning and
    completeness relevance field must also be a string.



optimize_cv_task:

  description: >
    Optimize the CV for the specific job using the original StructuredCV,
    source CV text, structured job posting, and ReviewerResult. Verify review
    conclusions against the source; do not follow them blindly. Preserve the
    existing evidence rules and detailed audit trail.

    PHASE 1 - AUTONOMOUS OPTIMIZATION

    Find every useful improvement supported by existing CV evidence before
    asking questions. Improve clarity, relevance, wording, and visibility while
    preserving factual meaning. Prioritize the Reviewer's most important job
    requirements. Keep each ProposedCVChange granular and independently
    reviewable. Describe each field-level content improvement in section,
    current_content, proposed_content, rationale, evidence_source,
    source_evidence, user_provided_evidence, and requires_human_approval.
    Set requires_human_approval to true. Use only cv, user, or cv_and_user as
    evidence_source. Keep CV evidence separate from user evidence. The
    proposed changes explain content improvements; they do not authorize
    creating, deleting, renaming, or reordering final document sections.
    GeneratedCV and the fixed renderer own the final information architecture.

    Review every source section before proposing changes: summary, education,
    each role, projects, skills, languages, certifications, achievements, and
    other evidence. Look for duplication, vague wording, buried relevant facts,
    inconsistent dates, and misleading categories. Preserve useful original
    information even when it is not a job keyword. Do not propose changes just
    to appear active; every change needs a clear rationale and traceable
    evidence. Job terminology is allowed only when candidate evidence supports
    the same meaning.

    Preserve distinctions between coursework and employment, participation
    and leadership, team results and individual contributions, in-progress
    study and completed qualifications, and listed versus demonstrated
    skills. Do not add metrics, outcomes, responsibilities, seniority, or
    scope to strengthen a claim. If a change combines several facts, cite
    evidence for each fact. Never cite a job requirement or Reviewer wording
    as evidence about the candidate.

    Before asking questions, review all original CV sections and source text.
    Identify duplicate information, unclear wording, strong evidence that is
    difficult to find, and supported evidence relevant to the highest-priority
    job requirements. Improve these points without exaggerating seniority,
    scope, outcomes, or proficiency. Preserve useful original information even
    when it is not a job keyword. Do not propose a change merely to create the
    appearance of activity; every change must have a specific rationale and
    traceable evidence. Do not use the job posting as evidence about the
    candidate. Job terminology may be used only when the underlying candidate
    evidence supports it.

    PHASE 2 - COMBINED GAP CHECKLIST AND QUESTIONS

    Before job-gap questions, run a mandatory section-by-section CV
    confirmation pass. It is required even when the Reviewer marked a field
    present: confirm that extracted information is accurate and ask whether
    omitted information exists. Ask one focused question at a time, wait for
    the answer, record it, and then move to the next item. Do not bundle
    unrelated sections. Skip only a field explicitly confirmed in a previous
    answer during this run.

    Cover these items in order, adapting questions to known information:
    1. Target role/headline: state the exact job title from the posting and
       confirm that it is the role being pursued. The final headline must be
       exactly that title.
    2. Contact/profile: separately ask for an exact LinkedIn URL and any relevant
       portfolio or professional profile URLs (such as GitHub for software/data roles,
       or professional registers/portfolios when applicable) when absent. Explicitly
       allow “I do not have one” for each.
    3. Professional experience: summarize listed roles for confirmation. If
       none are listed, explicitly ask whether employment, internships,
       freelance, or other relevant experience should be added. Accept a
       confirmed “none” without creating an empty section or negative claim.
    4. Education: confirm each qualification, institution, dates,
       completion/in-progress status, and grade shown; ask separately whether
       another qualification is missing. Never transfer a grade or date
       between qualifications.
    5. Skills: review and confirm skills grouped into domain-appropriate categories
       relevant to the candidate's profession (e.g., Core Competencies, Tools/Instruments,
       Methodologies/Protocols, or Transferable Skills). Confirm the listed items in
       each category; if a category is empty or unstated, ask whether there is anything
       to add or whether it should remain empty. Record only named skills with verified
       evidence, do not infer proficiency, and do not add job requirements as candidate skills.
    6. Languages: confirm each language and level, and ask whether another
       language should be included. Never guess proficiency.
    7. Certifications/training: confirm each exact name, issuer, and stated
       date/year; ask whether others exist. If none are listed, explicitly ask
       whether the candidate has relevant certifications or training and
       accept “none”. Never infer an issuer or date.
    8. Projects, volunteering, achievements, and other evidence: confirm
       listed items and ask whether relevant items are missing. Keep projects,
       employment, volunteering, and achievements distinct.
    9. Summary and location: confirm factual claims in the summary and that
       contact location contains only city/locality and country. Do not ask
       for a full street address.

    A single question may confirm multiple existing entries in the same
    section, but unrelated facts must be asked separately. A “yes” confirms
    only the exact entries stated in that question. Ask focused follow-ups for
    ambiguous corrections. Record each answer in user_answers with a
    section-specific gap identifier and resolution. An explicit “none” must
    not become CV content. Add unanswered or uncertain details to
    unresolved_evidence_gaps.

    The Reviewer provides two independent types of gaps: job-fit gaps and
    CV-completeness gaps. Both must be considered during the questioning
    phase. Job-fit gaps are requirement_matches whose status is no_evidence,
    weak_evidence, or uncertain. CV-completeness gaps are completeness items
    whose status is missing or uncertain. A completeness gap means the
    information is unknown, not that the candidate lacks it.

    Build one internal atomic checklist from both categories, plus distinct
    entries in missing_evidence and weak_evidence not already covered. Keep
    job-fit questions separate from completion questions even where subjects
    overlap. Ask completeness questions only when the Reviewer explains why
    the field is relevant to this candidate/role. Deduplicate identical gaps,
    not distinct evidence requirements.

    Ask one focused, answerable question for every relevant open gap using
    ask_user. Ask for exact missing information. For a missing LinkedIn or
    GitHub, request the exact URL; for languages, ask for each language and
    stated proficiency; for certifications/training, ask for name,
    issuer/provider, and year. Never construct URLs, infer certifications,
    infer proficiency, or assume the candidate has a common skill. A gap is
    not a negative answer. Check StructuredCV, original CV text, and every
    previous answer before asking; never repeat known information.

    When questioning about experience or a project, anchor the question to the
    specific role/project and distinguish responsibilities, outcomes, dates,
    tools, and the candidate's individual contribution. Do not silently use a
    general answer as evidence for a different gap. Ask about logistical or
    eligibility criteria only when the job posting makes them relevant. If the
    candidate explicitly says no or not applicable, record that resolution
    and do not turn the negative answer into a CV claim.

    Questions should identify the exact open topic and invite enough context
    to assess it. For a technical skill, ask where and how it was used and what
    the candidate personally did. For project evidence, ask for the project,
    dates, technologies, contribution, and outcome only as needed to resolve
    that gap. For eligibility or availability, ask for exact dates or
    conditions relevant to the posting. Do not bundle unrelated questions or
    treat one broad positive answer as evidence for each gap.

    If an answer is partial, preserve only its supported portion and keep the
    remaining detail unresolved. Follow up only on the missing detail. Never
    treat silence, an empty answer, or an ambiguous answer as confirmation.

    If an answer is ambiguous or scoped to the wrong role, project, degree,
    date, or requirement, ask a focused clarification. If a positive answer
    lacks sufficient evidence detail, ask one focused follow-up. Record every
    question and answer, including no answers. For each gap, record its gap
    identifier and resolution: supported, unsupported, not_applicable, or
    unresolved. A yes/no answer resolves only the exact question it answers.
    Keep original source_evidence separate from user_provided_evidence.

    Do not stop after a useful answer, after a fixed question count, or after
    technical gaps. Continue until each relevant gap is supported,
    unsupported, not applicable, or explicitly unresolved. Every remaining
    unsupported or ambiguous item must appear in unresolved_evidence_gaps.
    Before finishing, check consistency across names, dates, institutions,
    degrees, roles, projects, and technologies. Never move a confirmed fact
    between entities or strengthen it beyond the answer.

    Before returning, audit the checklist item by item. Confirm each gap has a
    CV source, explicit answer, explicit negative/not-applicable answer, or
    unresolved status. Confirm every answer and resolution appears in the
    audit trail, user evidence is not mixed into source_evidence, and every
    proposed change cites evidence that directly supports its content and is
    marked for human approval. Remove any unsupported proposed content.

    Before returning, audit the checklist item by item. Confirm each gap has a
    corresponding CV source, explicit answer, negative/not-applicable answer,
    or unresolved status. Confirm every user answer appears in the audit trail
    with its gap and resolution, and that user evidence is not mixed into
    source_evidence. Confirm every proposed change cites evidence that
    directly supports its proposed content and is marked for human approval.

    Never access external candidate sources or the final CV template. Do not
    create Markdown or decide final section order, headings, or formatting.
    Do not add job-posting skills, technologies, metrics, dates, outcomes,
    responsibilities, or qualifications without candidate evidence. The
    GeneratedCV mapper and deterministic renderer handle the final document.

  expected_output: >
    CVOptimizationResult with granular proposed_changes, all questions and
    answers, user_provided_evidence, strategy, and every unresolved gap. Do
    not include an optimized Markdown document.


generate_cv_task:
  description: >
    Generate the final GeneratedCV from StructuredCV and
    CVOptimizationResult.

    Build the CV using the candidate's existing information as the source
    of truth. Use optimization suggestions to improve relevance, clarity,
    wording and presentation when they are supported by candidate evidence.

    You are allowed to rewrite and synthesize information. The final CV
    does not need to reproduce the source wording verbatim, but it must
    preserve the underlying facts accurately.

    Do not introduce information merely because it would make the CV
    stronger or because it is required or preferred by the target job.

    Do not infer missing qualifications, skills, experience, achievements,
    metrics, dates, certifications, languages, proficiency levels,
    locations, or URLs.

    If a fact is unsupported or ambiguous, omit it rather than guessing.

    Return only a valid GeneratedCV Pydantic model. The deterministic
    renderer is responsible for the document structure and formatting.

  expected_output: >
    A valid GeneratedCV containing an accurate, professional and
    appropriately optimized representation of the candidate.