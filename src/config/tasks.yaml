# ==============================================================================
# TASKS CONFIGURATION - CV MAXING PIPELINE
# ==============================================================================

parse_cv_task:
  description: >
    Parse the candidate CV located at {cv}.

    1. EXTRACTION:
       - Use the convert_cv_to_markdown tool to extract the text content of the PDF.
       - Store the full extracted Markdown in StructuredCV.cv as the baseline evidence.

    2. REASONING & STRUCTURAL MAPPING:
       - Education: Categorize formal academic degrees under 'education'. If the document
         displays an occupational status with a field of study (e.g. Europass "[2023-Current]
         University Student" with "Field of study: Engenharia Informática"), deduce the actual
         degree title (e.g. "Licenciatura em Engenharia Informática" / "Bachelor in Informatics
         Engineering"). Never leave degree as generic "University Student". Clean institution
         names by removing trailing URLs.
       - Certifications & Workshops: Route non-degree workshops, short courses, and technical
         training (e.g. "GIT Workshop", "Programar o Futuro") to 'certifications', NOT 'education'.
       - Global Skills Extraction: Scan the entire document (experience bullets, projects,
         workshops, competitions) for explicitly mentioned technologies, languages, and tools.
         Populate the top-level 'skills' list with clean names, source_section, and source_text.
         Never leave skills empty when technologies are evidenced anywhere in the CV text.
       - Experience vs. Projects vs. Volunteering:
         * Internal company projects worked on during employment stay within 'experience'.
         * Standalone projects, hackathons, and competitions belong in 'projects'.
         * Volunteering, student union, and extracurricular roles MUST be placed in 'projects'
           (with volunteering_or_other="Volunteering"), NEVER as standard employment 'experience'.
       - Languages: Extract language names and clean CEFR levels (e.g. "Mother tongue", "B2", "A1")
         without dumping raw multi-parameter evaluation grids.
       - Contact: Extract name, email, phone, city/country location, and clean profile links.

    3. STRICT CONSTRAINTS:
       - Preserve all factual evidence without inferring unstated details.
       - Do not evaluate, score, or match against job postings.
       - Return only valid StructuredCV.
  expected_output: >
    A fully populated StructuredCV containing clean education, work experience, evidenced
    skills, standalone projects, certifications, languages, achievements, and contact info.


parse_job_task:
  description: >
    Parse the job posting provided below:

    {job}

    1. EXTRACTION:
       - If {job} is a URL, extract it using convert_job_to_markdown. If provided as text,
         use that content directly as the source of truth.

    2. STRUCTURAL MAPPING:
       - Extract job_title, company (name, location, website), location, employment_type,
         and seniority level.
       - Differentiate required vs. preferred skills and qualifications whenever stated.
       - Categorize requirements into skills, experience_requirements, education_requirements,
         responsibilities, keywords, and other_requirements.
       - Record source_section and source_text for each requirement.

    3. STRICT CONSTRAINTS:
       - Never invent requirements or extrapolate criteria not explicitly written in the text.
       - Do not evaluate candidates or score requirements.
       - Return only valid StructuredJob.
  expected_output: >
    A structured StructuredJob model containing the job title, company, location, required
    and preferred skills, experience, education, and responsibilities with source evidence.


review_cv_task:
  description: >
    Review the structured CV against the structured job posting using a two-part evaluation:

    1. METHODOLOGY & FRAMEWORK:
       - Call get_evaluation_framework to retrieve the evaluation rubric and criteria.
       - Use StructuredCV and StructuredJob as the sole sources of truth.

    2. PART A - JOB FIT ASSESSMENT:
       - Evaluate every explicitly stated requirement in the job posting.
       - Assign each requirement an EvidenceStatus: satisfied, weak_evidence, no_evidence,
         or uncertain. Differentiate skills merely listed from those demonstrated with context.
       - Prioritize mandatory/required criteria over preferred/optional criteria.
       - Populate requirement_matches, missing_evidence, weak_evidence, strengths,
         weaknesses, and overall_assessment.
       - Do NOT assign numeric scores or make hiring/viability decisions.

    3. PART B - CV COMPLETENESS EVALUATION:
       - Independently inspect the CV for completeness across standard dimensions: contact info,
         headline, email, phone, location, LinkedIn URL, GitHub/portfolio URL, professional summary,
         experience, education, technical skills, tools/software, methodologies, transferable skills,
         languages, certifications/training, projects, and GDPR consent.
       - Assign status (present, missing, uncertain), relevance, reasoning, and evidence for each.
       - Differentiate platform mentions (e.g. "code on GitHub") from exact URLs.

    4. STRICT CONSTRAINTS:
       - Keep job-fit gaps and completeness items distinct.
       - Never search external web sources or invent candidate data.
       - Return only valid ReviewerResult.
  expected_output: >
    A complete ReviewerResult model with requirement_matches, completeness items, missing
    evidence, weak evidence, strengths, weaknesses, overall_assessment, and reasoning.


optimize_cv_task:
  description: >
    Optimize the candidate's CV for the target job following a strict two-phase workflow:

    1. PHASE 1 - AUTONOMOUS EVIDENCE-BASED OPTIMIZATION:
       - Use existing CV evidence and the Reviewer's diagnosis to identify supported improvements
         in clarity, relevance, information hierarchy, and professional wording across all sections.
       - Summary: Propose an impactful 2 to 3-line professional summary adhering to format research:
         (1) candidate identity and target role; (2) 2-3 verified core skills aligned with the job;
         (3) a concrete verified achievement or project result. Ground every detail strictly in evidence.
       - Record each proposed change with section, current_content, proposed_content, rationale,
         evidence_source: "cv", source_evidence, and requires_human_approval: true.

    2. PHASE 2 - MANDATORY INTERACTIVE HITL QUESTIONS (TOOL EXECUTION REQUIRED):
       - TOOL CALLING DIRECTIVE: You MUST execute the ask_user tool for EACH of the 9 sections below,
         one section at a time. It is strictly mandatory to address every single section in sequence.
         DO NOT output the final JSON until all 9 sections have been completed.
       - Questioning Rule for Every Section:
         * IF INFORMATION EXISTS (in CV or Job): State the known facts and ask for Yes/No confirmation
           (e.g., "We found / propose [X]. Do you confirm? (Yes/No)").
         * IF INFORMATION DOES NOT EXIST (Missing): Ask if the candidate has that information to add
           (e.g., "Do you have any [X] to include? (If none, reply 'I do not have one')").
       - Mandatory 9-Section Checklist (ask one at a time via ask_user):
         1. Target role: confirm job title as headline (Yes/No, or specify another).
         2. Contact & links: if present, confirm (Yes/No); if any missing (phone, LinkedIn, GitHub), ask for missing items.
         3. Employment: if listed, state role/company/dates and confirm (Yes/No); if none, ask if candidate has work experience.
         4. Education: if listed, state degree/institution/grade and confirm (Yes/No); if none, ask for academic background.
         5. Technical skills gaps: if missing job technologies exist, ask if candidate has experience with them; if none missing, confirm skills (Yes/No).
         6. Languages: if listed, confirm (Yes/No); if none, ask if candidate speaks other languages.
         7. Certifications: if listed, confirm (Yes/No); if none, ask if candidate has certifications/licenses.
         8. Projects: if listed, confirm (Yes/No); if none, ask if candidate has projects/repositories to include.
         9. Summary focus: propose key strengths to highlight and confirm (Yes/No).
       - Handling Candidate Answers:
         * Store new candidate evidence in user_provided_evidence and create ProposedCVChange items.
         * Record every question in questions_asked and answer in user_answers.
         * Record unaddressed gaps or negative answers in unresolved_evidence_gaps.

    3. STRICT CONSTRAINTS:
       - Never invent skills, qualifications, metrics, or technologies not confirmed by the candidate.
       - Every proposed change requires human approval (requires_human_approval: true).
       - Return only a valid CVOptimizationResult model (do not author Markdown or raw layout).
  expected_output: >
    A complete CVOptimizationResult model containing granular proposed_changes, questions_asked,
    user_answers, user_provided_evidence, strategy, and unresolved_evidence_gaps.


generate_cv_task:
  description: >
    Consolidate candidate facts from StructuredCV and approved CVOptimizationResult into GeneratedCV:

    1. DATA CONSOLIDATION:
       - Use original candidate evidence as the source of truth, enhanced by candidate-confirmed
         optimization improvements.
       - Preserve factual accuracy across names, roles, institutions, dates, grades, and technologies.
       - If a detail is unsupported or ambiguous, omit it rather than guessing.

    2. SECTION SPECIFIC MAPPING RULES:
       - Header & Contact:
         * Populate name, headline (exact target job title), email, phone, and location.
         * contact.portfolio is STRICTLY for a personal portfolio website or personal homepage.
           Never put individual project URLs, competition links, demo links, or repository links
           into contact.portfolio. If the candidate has no personal portfolio, leave it null.
       - Education: Ensure degree clearly identifies the academic qualification and major/field of study
         (e.g. "Bachelor in Informatics Engineering" or "Licenciatura em Engenharia Informática"). Never
         leave degree as a generic status like "University Student". Clean institution names by ensuring
         no URLs (e.g. https://...) are included. Place non-degree workshops in certifications.
       - Experience vs. Projects vs. Volunteering:
         * Professional employment belongs in 'experience'.
         * Volunteering, extracurricular, or student leadership roles belong in 'projects' with
           volunteering_or_other="Volunteering", NEVER in 'experience'.
       - Summary: Synthesize a 2 to 3-line impactful professional summary grounded in verified skills
         and achievements matching the role.
       - Skills: Organize verified candidate skills into clean SkillCategory items with professional
         titles (e.g. "Programming Languages", "Libraries & Frameworks", "Tools & Technologies").
       - Projects: Include project name, dates (if known), concise description, and project link.

    3. STRICT CONSTRAINTS:
       - Never invent qualifications, employers, metrics, or technologies.
       - Output only structured data conforming to the GeneratedCV Pydantic schema.
       - Do not author raw HTML, CSS, or markdown layout; rendering is handled deterministically.
  expected_output: >
    A valid GeneratedCV Pydantic model representing an accurate, professional, and optimized CV.
