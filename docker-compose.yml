services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cv-maxing:latest
    container_name: cv-maxing-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: ["uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "8000"]

  dev:
    image: cv-maxing:latest
    container_name: cv-maxing-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
